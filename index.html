<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BITEZ | Night Canteen</title><link rel="manifest" href="/manifest.json"><style>
:root{--bg:#090d12;--panel:#111923;--line:#263342;--text:#f5f7fb;--muted:#9eabbc;--red:#e53935;--gold:#ffbf47}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at top,#172331 0,#090d12 55%);color:var(--text)}header{padding:28px 16px 24px;text-align:center;background:linear-gradient(135deg,#111923,#241016);border-bottom:1px solid #36232a}header .logo{font-size:clamp(34px,7vw,54px);font-weight:900;letter-spacing:5px;color:#fff;margin:0;text-shadow:0 0 22px #e5393540}header .tag{color:#ffb9b7;letter-spacing:2px;font-size:12px;text-transform:uppercase;margin:9px 0 0}header .brand{margin-top:13px;color:#aab6c5;font-size:12px}main{max-width:980px;margin:24px auto;padding:0 14px 40px}.card{background:linear-gradient(145deg,#131c27,#0e151e);border:1px solid var(--line);padding:20px;border-radius:18px;margin:16px 0;box-shadow:0 12px 35px #0004}.section-title{margin:0 0 16px;font-size:21px;display:flex;align-items:center;gap:9px}.section-title:before{content:"";width:4px;height:22px;border-radius:9px;background:var(--red)}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}.item{border:1px solid #293747;border-radius:15px;overflow:hidden;background:#101923;display:flex;flex-direction:column;transition:.2s}.item:hover{transform:translateY(-3px);border-color:#a33}.foodimg{width:100%;height:165px;object-fit:cover;background:#1b2632}.foodinfo{padding:13px 13px 8px;font-weight:700;font-size:16px}.item-bottom{padding:0 13px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.price{color:var(--gold);font-weight:800;font-size:18px}.addbtn,button{background:linear-gradient(135deg,#f0443e,#bd202b);color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;box-shadow:0 5px 14px #e5393528}.addbtn:disabled,button:disabled{background:#536071;box-shadow:none}.cold-options{padding:0 13px 10px}.cold-options select{margin:0}.cartline{padding:9px 0;border-bottom:1px solid #263342;display:flex;justify-content:space-between;gap:10px;align-items:center}.qty button{padding:5px 10px;margin-left:4px}.total{font-size:24px;font-weight:900;color:var(--gold)}label{display:block;color:#c3ceda;font-size:13px;margin:9px 0 5px}input,select{width:100%;padding:12px;margin:0 0 10px;background:#0b121a;color:#fff;border:1px solid #344354;border-radius:10px;outline:none}input:focus,select:focus{border-color:#e53935}.method{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 16px}.method label{display:flex;align-items:center;gap:8px;margin:0}.method input{width:auto;margin:0}.pay{width:100%;padding:15px;font-size:16px}.paymentbox{text-align:center;overflow-wrap:anywhere}.paymentbox img{border-radius:14px;border:6px solid white;max-width:100%;height:auto}.paymentbox a{color:#ffb9b7}.muted{color:var(--muted);font-size:12px}@media(max-width:520px){.card{padding:15px}.foodimg{height:145px}}
 .tagline{margin:6px 0 18px;text-align:center;color:#c9c9c9;font-size:14px;letter-spacing:.3px}</style></head><body><header><h1 class="logo">BITEZ</h1>\n<p class="tagline">Serving You with Love & Quality for the Last 5 Years</p><p class="tag">Late night cravings · Delivered to your hostel</p><div class="brand">AKASH TRADERS · NIGHT CANTEEN</div></header><main>
<div class="card"><h2 class="section-title">🍽️ Tonight's Menu</h2><div id="menu" class="menu">Loading menu…</div></div>
<div class="card"><h2 class="section-title">🛒 Your Cart</h2><div id="cart">Your cart is empty</div><p class="total">Total ₹<span id="total">0</span></p>
<label>Name</label><input id="name" placeholder="Enter your name"><label>Mobile (10 digits)</label><input id="mobile" maxlength="10" inputmode="numeric" placeholder="Mobile number"><label>Hostel</label><select id="hostel"><option value="">Select hostel</option><option>H1</option><option>H2</option><option>H3</option><option>H4</option><option>H5</option><option>H6</option><option>H7</option><option>H8</option><option>H9</option><option>H10</option><option>H11</option></select>
<h3>Payment method</h3><div class="method"><label><input type="radio" name="payment" value="UPI" checked> UPI QR</label><label><input type="radio" name="payment" value="Cash on Delivery"> Cash on Delivery</label></div><button class="pay" onclick="order()">Place Order →</button></div><div class="card paymentbox" id="paybox" hidden></div></main>
<script>
let menu=[],cart={};const $=x=>document.getElementById(x);
const foodPics={"Aloo Pyaz Paratha":"images/aloo-pyaz.jpg","Aalu Pyaz Paratha":"images/aloo-pyaz.jpg","Paneer Pyaz Paratha":"images/paneer-pyaz.jpg","Coke":"images/coke.jpg","Cold Drink":"images/coke.jpg","Cold Drink 250 ml":"images/coke.jpg","Cold Drink 750 ml":"images/coke.jpg","Dahi Cup 160gm":"images/dahi-cup.jpg","Dahi Cup":"images/dahi-cup.jpg","Sandwich":"images/sandwich.jpg","Maggi":"images/maggi.jpg","Burger":"images/burger.jpg","Fries":"images/fries.jpg","default":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=85"};
async function init(){try{let all=await fetch('/api/menu').then(r=>r.json());menu=all.filter(m=>!m.name.toLowerCase().includes('chips'));let drinkIds=menu.map((m,i)=>({m,i})).filter(x=>/cold drink|coke/i.test(x.m.name));let prices=drinkIds.map(x=>x.m.price);let drinkAvailable=drinkIds.some(x=>x.m.available!==false);menu=menu.filter(m=>!(/cold drink|coke/i.test(m.name)));menu.push({name:'Coke',price:20,available:drinkAvailable,drinkPrices:prices.length?prices:[20,40,50]});renderMenu()}catch(e){$('menu').textContent='Server not running'}}
function renderMenu(){$('menu').innerHTML=menu.map((m,i)=>{let isCoke=m.name==='Coke';return `<article class="item"><img class="foodimg" src="${foodPics[m.name]||foodPics.default}" alt="${m.name}" onerror="this.src=foodPics.default"><div class="foodinfo">${m.name}</div>${isCoke?`<div class="cold-options"><label>Choose size</label><select id="cokePrice"><option value="20">250 ml — ₹20</option><option value="40">750 ml — ₹40</option></select></div>`:''}<div class="item-bottom"><span class="price" id="price-${i}">${isCoke?'From ₹20':'₹'+m.price}</span><button class="addbtn" ${m.available===false?'disabled':''} onclick="add(${i})">＋ Add</button></div></article>`}).join('')}
function add(i){let m=menu[i];if(m.name==='Coke'){let p=+$('cokePrice').value;let key='coke'+p;cart[key]=cart[key]||{name:(p===20?'Cold Drink 250 ml':'Cold Drink 750 ml'),backendName:'Cold Drink '+p,price:p,qty:0};cart[key].qty++}else{let key='item'+i;cart[key]=cart[key]||{name:m.name,backendName:m.name,price:m.price,qty:0};cart[key].qty++}draw()}function qty(k,d){cart[k].qty+=d;if(cart[k].qty<=0)delete cart[k];draw()}
function draw(){let ids=Object.keys(cart),sum=ids.reduce((s,k)=>s+cart[k].price*cart[k].qty,0);$('cart').innerHTML=ids.length?ids.map(k=>`<div class="cartline"><span>${cart[k].name} × ${cart[k].qty}</span><span class="qty"><button onclick="qty('${k}',-1)">−</button><button onclick="qty('${k}',1)">+</button></span></div>`).join(''):'Your cart is empty';$('total').textContent=sum}
async function order(){let name=$('name').value.trim(),mobile=$('mobile').value.trim(),hostel=$('hostel').value,ids=Object.keys(cart),total=ids.reduce((s,k)=>s+cart[k].price*cart[k].qty,0),method=document.querySelector('input[name="payment"]:checked').value;if(!ids.length)return alert('Add items to cart first');if(!name||!/^[0-9]{10}$/.test(mobile)||!hostel)return alert('Fill name, valid 10-digit mobile and hostel');let items=ids.map(k=>({name:cart[k].backendName,displayName:cart[k].name,qty:cart[k].qty,price:cart[k].price}));try{let res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mobile,hostel,items,total,paymentMethod:method})}),o=await res.json();if(!res.ok)throw Error(o.error||'Order error');let orderId=o.id||o.order?.id;$('paybox').hidden=false;const orderText=`BITEZ ORDER #${orderId}\nName: ${name}\nMobile: ${mobile}\nHostel: ${hostel}\nItems: ${items.map(x=>x.name+' x'+x.qty).join(', ')}\nTotal: ₹${total}\nPayment: ${method}`,waUrl=`https://wa.me/919588301580?text=${encodeURIComponent(orderText)}`;if(method==='UPI'){const upi='akashtraders1580@sbi',payee='AKASH TRADERS',upiLink=`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(payee)}&am=${total}&cu=INR&tn=${encodeURIComponent('BITEZ '+orderId)}`,qr='https://api.qrserver.com/v1/create-qr-code/?size=280x280&data='+encodeURIComponent(upiLink);$('paybox').innerHTML=`<h2>Order #${orderId} placed 🎉</h2><h3>Pay ₹${total} using UPI</h3><img width="280" height="280" alt="UPI QR" src="${qr}"><p>UPI ID: <b>${upi}</b></p><p><a href="${upiLink}">Open UPI app</a></p><small class="muted">Payment will be verified by the canteen.</small><p><a target="_blank" href="${waUrl}"><button>Send Order on WhatsApp</button></a></p>`}else{$('paybox').innerHTML=`<h2>Order #${orderId} confirmed 🎉</h2><h3>Cash on Delivery ₹${total}</h3><p>Pay cash when your order arrives.</p><p>Payment status: Unpaid (COD)</p><p><a target="_blank" href="${waUrl}"><button>Send Order on WhatsApp</button></a></p>`}$('paybox').scrollIntoView({behavior:'smooth'});cart={};draw()}catch(e){alert('Order failed: '+e.message)}}init();draw();if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
